name: Auto Approve PR (Reusable)

on:
  workflow_call:

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CODEOWNERS
            .github/CODEOWNERS
            docs/CODEOWNERS

      - name: Check if author is a code owner and approve
        env:
          APP_USER_TOKEN: ${{ secrets.APP_USER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="1.0.0"
          echo "Auto Approve Workflow Version: $VERSION"
          
          # Find CODEOWNERS file
          CODEOWNERS_FILE=""
          for path in "CODEOWNERS" ".github/CODEOWNERS" "docs/CODEOWNERS"; do
            if [ -f "$path" ]; then
              CODEOWNERS_FILE="$path"
              echo "Found CODEOWNERS at: $path"
              break
            fi
          done

          if [ -z "$CODEOWNERS_FILE" ]; then
            echo "No CODEOWNERS file found. Skipping."
            exit 0
          fi

          # Parse CODEOWNERS - extract users and teams
          ENTRIES=$(cat "$CODEOWNERS_FILE" | tr ' ' '\n' | grep '^@' | sed 's/@//' | sort -u)

          APPROVED_USERS=""

          for entry in $ENTRIES; do
            if [[ "$entry" == *"/"* ]]; then
              # This is a team reference: org/team-name
              ORG=$(echo "$entry" | cut -d'/' -f1)
              TEAM=$(echo "$entry" | cut -d'/' -f2)
              echo "Resolving team: $ORG/$TEAM"
              
              # Fetch team members using GITHUB_TOKEN
              RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/orgs/$ORG/teams/$TEAM/members")
              
              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | sed '$d')
              
              if [ "$HTTP_CODE" = "200" ]; then
                TEAM_MEMBERS=$(echo "$BODY" | jq -r '.[].login' 2>/dev/null || echo "")
                if [ -n "$TEAM_MEMBERS" ]; then
                  echo "Team members: $TEAM_MEMBERS"
                  APPROVED_USERS="$APPROVED_USERS $TEAM_MEMBERS"
                else
                  echo "No members found"
                fi
              else
                echo "Failed to fetch team members for $ORG/$TEAM. HTTP Status: $HTTP_CODE"
              fi
            else
              # This is an individual user
              APPROVED_USERS="$APPROVED_USERS $entry"
            fi
          done

          # Remove duplicates and check if PR author is approved
          APPROVED_USERS=$(echo "$APPROVED_USERS" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "Approved users: $APPROVED_USERS"

          IS_APPROVED=false
          for user in $APPROVED_USERS; do
            if [ "$user" == "$PR_AUTHOR" ]; then
              IS_APPROVED=true
              break
            fi
          done

          if [ "$IS_APPROVED" = true ]; then
            echo "PR author '$PR_AUTHOR' is a code owner. Approving PR..."
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/reviews" \
              -d '{"event":"APPROVE","body":"Auto-approved: PR author is a code owner."}'
            echo "PR approved successfully."
          else
            echo "PR author '$PR_AUTHOR' is not a code owner. Skipping approval."
          fi

          # https://github.com/orgs/MicrosoftDocs/teams/msecd-codeowners/members