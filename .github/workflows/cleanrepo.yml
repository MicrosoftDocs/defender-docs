name: "Clean Repo"

on:
  schedule:
    - cron: "0 1 1 * *"  # Runs monthly on the 1st at 01:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  clean-atadocs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and sync main
        run: |
          git remote add upstream https://github.com/MicrosoftDocs/defender-docs-pr.git
          git fetch upstream
          git checkout main
          git rebase upstream/main
          git push origin main --force-with-lease

      - name: Create and switch to new branch
        id: create_branch
        run: |
          BRANCH_NAME="cleanrepo-ATADocs-$(date +'%Y%m%d-%H%M')"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      # Run Clean Repo on ATADocs and subfolders
      - name: Run Clean Repo on ATADocs folders
        run: |
          folders=(
            "ATADocs"
            "ATADocs/DeployUse"
            "ATADocs/PlanDesign"
            "ATADocs/Understand"
            "ATADocs/Troubleshoot"
          )
          for folder in "${folders[@]}"; do
            echo "Cleaning $folder"
            gh workflow run dotnet/docs-tools/cleanrepo@main -f function=FindOrphanedArticles -f docfx_directory="$folder" -f target_directory="$folder" -f url_base_path="/dotnet"
            gh workflow run dotnet/docs-tools/cleanrepo@main -f function=FindOrphanedImages -f docfx_directory="$folder" -f target_directory="$folder" -f url_base_path="/dotnet"
            gh workflow run dotnet/docs-tools/cleanrepo@main -f function=FindOrphanedIncludes -f docfx_directory="$folder" -f target_directory="$folder" -f url_base_path="/dotnet"
            gh workflow run dotnet/docs-tools/cleanrepo@main -f function=FindOrphanedSnippets -f docfx_directory="$folder" -f target_directory="$folder" -f url_base_path="/dotnet"
          done

      - name: Push changes to new branch
        run: |
          git push origin ${{ steps.create_branch.outputs.branch_name }}

      - name: Create pull request
        uses: dotnet/actions-create-pull-request@v4
        with:
          branch: ${{ steps.create_branch.outputs.branch_name }}
          title: "Clean Repo $(date +'%b %Y'): ATADocs - $(date +'%Y%m%d-%H%M')"
          commit-message: "Automated cleanup for ATADocs and subfolders"
          body: |
            This PR was generated by the Clean Repo GitHub Action.
            It includes automated cleanup of:
            - Orphaned articles
            - Orphaned images
            - Orphaned includes
            - Orphaned snippets

            Target folders:
            - ATADocs
            - ATADocs/DeployUse
            - ATADocs/PlanDesign
            - ATADocs/Understand
            - ATADocs/Troubleshoot

            Please review before merging.

  clean-other-folders:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder:
          - ATPNDocs
          - defender
          - defender-xdr
          - defender-for-iot
          - defender-business
          - defender-endpoint
          - defender-for-cloud
          - defender-office-365
          - exposure-management
          - CloudAppSecurityDocs
          - unified-secops-platform
          - defender-vulnerability-management

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and sync main
        run: |
          git remote add upstream https://github.com/MicrosoftDocs/defender-docs-pr.git
          git fetch upstream
          git checkout main
          git rebase upstream/main
          git push origin main --force-with-lease

      - name: Create and switch to new branch
        id: create_branch
        run: |
          BRANCH_NAME="cleanrepo-${{ matrix.folder }}-$(date +'%Y%m%d-%H%M')"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Clean orphaned articles
        uses: dotnet/docs-tools/cleanrepo@main
        with:
          function: "FindOrphanedArticles"
          docfx_directory: "${{ matrix.folder }}"
          target_directory: "${{ matrix.folder }}"
          url_base_path: "/dotnet"

      - name: Clean orphaned images
        uses: dotnet/docs-tools/cleanrepo@main
        with:
          function: "FindOrphanedImages"
          docfx_directory: "${{ matrix.folder }}"
          target_directory: "${{ matrix.folder }}"
          url_base_path: "/dotnet"

      - name: Clean orphaned includes
        uses: dotnet/docs-tools/cleanrepo@main
        with:
          function: "FindOrphanedIncludes"
          docfx_directory: "${{ matrix.folder }}"
          target_directory: "${{ matrix.folder }}"
          url_base_path: "/dotnet"

      - name: Clean orphaned snippets
        uses: dotnet/docs-tools/cleanrepo@main
        with:
          function: "FindOrphanedSnippets"
          docfx_directory: "${{ matrix.folder }}"
          target_directory: "${{ matrix.folder }}"
          url_base_path: "/dotnet"

      - name: Push changes to new branch
        run: |
          git push origin ${{ steps.create_branch.outputs.branch_name }}

      - name: Create pull request
        uses: dotnet/actions-create-pull-request@v4
        with:
          branch: ${{ steps.create_branch.outputs.branch_name }}
          title: "Clean Repo $(date +'%b %Y'): ${{ matrix.folder }} - $(date +'%Y%m%d-%H%M')"
          commit-message: "Automated cleanup for ${{ matrix.folder }}"
          body: |
            This PR was generated by the Clean Repo GitHub Action.
            It includes automated cleanup of:
            - Orphaned articles
            - Orphaned images
            - Orphaned includes
            - Orphaned snippets

            Target folder: ${{ matrix.folder }}
            Please review before merging.
