name: "Clean Repo - ATADocs"

on:
  schedule:
    - cron: "0 1 1 * *" # Runs at 01:00, on day 1 of the month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  clean-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for rebase

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and sync main
        run: |
          git remote add upstream https://github.com/MicrosoftDocs/defender-docs-pr.git
          git fetch upstream
          git checkout main
          git rebase upstream/main
          git push origin main --force-with-lease

      - name: Create and switch to new branch
        id: create_branch
        run: |
          BRANCH_NAME="cleanrepo-atadocs-$(date +'%Y%m%d-%H%M%S')"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      # Run Clean Repo tool
      - name: Clean repo - orphaned articles
        uses: dotnet/docs-tools/cleanrepo@main
        with:
          function: "FindOrphanedArticles"
          docfx_directory: "ATADocs"
          target_directory: "ATADocs"
          url_base_path: "/dotnet"

      - name: Clean repo - orphaned images
        uses: dotnet/docs-tools/cleanrepo@main
        with:
          function: "FindOrphanedImages"
          docfx_directory: "ATADocs"
          target_directory: "ATADocs"
          url_base_path: "/dotnet"

      - name: Clean repo - orphaned includes
        uses: dotnet/docs-tools/cleanrepo@main
        with:
          function: "FindOrphanedIncludes"
          docfx_directory: "ATADocs"
          target_directory: "ATADocs"
          url_base_path: "/dotnet"

      - name: Clean repo - orphaned snippets
        uses: dotnet/docs-tools/cleanrepo@main
        with:
          function: "FindOrphanedSnippets"
          docfx_directory: "ATADocs"
          target_directory: "ATADocs"
          url_base_path: "/dotnet"

      - name: Push changes to new branch
        run: |
          git push origin ${{ steps.create_branch.outputs.branch_name }}

      - name: Create pull request
        uses: dotnet/actions-create-pull-request@v4
        with:
          branch: ${{ steps.create_branch.outputs.branch_name }}
          title: "Monthly cleanup: Orphaned content"
          commit-message: "Automated cleanup of orphaned articles, images, includes, and snippets"
          body: |
            This PR was generated by the Clean Repo GitHub Action.
            It includes automated cleanup of:
            - Orphaned articles
            - Orphaned images
            - Orphaned includes
            - Orphaned snippets

            Please review before merging.
