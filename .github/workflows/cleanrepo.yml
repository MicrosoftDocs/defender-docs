name: "Clean Repo - All Folders"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 * *" # Monthly at 01:00 on the 1st

permissions:
  contents: write
  pull-requests: write

jobs:
  clean-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and switch to new branch
        id: create_branch
        run: |
          BRANCH_NAME="cleanrepo-all-$(date +'%Y%m%d-%H%M')"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Clean orphaned content in all folders
        uses: actions/github-script@v6
        with:
          script: |
            const folders = [
              "ATADocs",
              "ATADocs/DeployUse",
              "ATADocs/PlanDesign",
              "ATADocs/Understand",
              "ATADocs/Troubleshoot",
              "ATPDocs",
              "defender",
              "defender-xdr",
              "defender-for-iot",
              "defender-business",
              "defender-endpoint",
              "defender-for-cloud",
              "defender-office-365",
              "exposure-management",
              "CloudAppSecurityDocs",
              "unified-secops-platform",
              "defender-vulnerability-management"
            ];

            const functions = [
              "FindOrphanedArticles",
              "FindOrphanedImages",
              "FindOrphanedIncludes",
              "FindOrphanedSnippets"
            ];

            for (const folder of folders) {
              for (const func of functions) {
                await exec.exec('git', ['restore', '--source=HEAD', '--staged', '--worktree', folder]);
                await exec.exec('git', ['clean', '-fd', folder]);
                await exec.exec('git', ['pull']);
                await exec.exec('git', ['checkout', '${{ steps.create_branch.outputs.branch_name }}']);

                await exec.exec('gh', [
                  'run', 'dotnet/docs-tools/cleanrepo@main',
                  '--function', func,
                  '--docfx_directory', folder,
                  '--target_directory', folder,
                  '--url_base_path', '/dotnet'
                ]);
              }
            }

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "Clean Repo: Automated cleanup across all folders"
          git push origin ${{ steps.create_branch.outputs.branch_name }}

      - name: Create pull request
        uses: dotnet/actions-create-pull-request@v4
        with:
          branch: ${{ steps.create_branch.outputs.branch_name }}
          title: "Clean Repo: Monthly cleanup across all folders"
          commit-message: "Automated cleanup for all folders"
          body: |
            This PR was generated by the Clean Repo GitHub Action.
            It includes automated cleanup of:
            - Orphaned articles
            - Orphaned images
            - Orphaned includes
            - Orphaned snippets

            Target folders:
            - ATADocs and subfolders
            - ATPDocs
            - defender and related folders
            - CloudAppSecurityDocs
            - unified-secops-platform
            - defender-vulnerability-management

            Please review before merging.
