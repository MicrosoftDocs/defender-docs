name: Require Writer Review

on:
  workflow_call:

env:
  TEST_USER: '' # Set to a GitHub username to override the event-derived user for testing

jobs:
  enforce-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout calling repo for approvers file
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            authorized-approvers.txt
            .github/authorized-approvers.txt
            docs/authorized-approvers.txt

      # --- Gather PR state ---

      - name: Resolve PR number
        id: resolve
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number found. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch PR state
        if: steps.resolve.outputs.skip != 'true'
        id: pr-state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="3.0.0"
          echo "Require Writer Review Workflow Version: $VERSION"

          PR_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")

          PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
          PR_MERGED=$(echo "$PR_DATA" | jq -r '.merged')
          PR_DRAFT=$(echo "$PR_DATA" | jq -r '.draft')
          if [ "$PR_STATE" = "closed" ] || [ "$PR_MERGED" = "true" ] || [ "$PR_DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is $PR_STATE (merged: $PR_MERGED, draft: $PR_DRAFT). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HAS_QUALIFIES=$(echo "$PR_DATA" | jq -r '[.labels[].name] | contains(["qualifies-for-auto-merge"])')
          HAS_BLOCKED=$(echo "$PR_DATA" | jq -r '[.labels[].name] | contains(["blocked-qualifies-for-auto-merge"])')
          PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login')

          echo "PR #$PR_NUMBER — author: $PR_AUTHOR, has_qualifies: $HAS_QUALIFIES, has_blocked: $HAS_BLOCKED"
          echo "has_qualifies=$HAS_QUALIFIES" >> "$GITHUB_OUTPUT"
          echo "has_blocked=$HAS_BLOCKED" >> "$GITHUB_OUTPUT"
          echo "pr_author=$PR_AUTHOR" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check if last PRMerger command is sign-off
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        id: signoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-state.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking last PRMerger command..."
          COMMENTS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")

          LAST_ENTRY=$(echo "$COMMENTS" | jq -r '
            [.[] | select(.body | test("^#[a-zA-Z-]+"))] | last |
            {command: (.body | split("\n")[0] | ascii_downcase), author: .user.login}
          ' 2>/dev/null || echo '{}')

          LAST_COMMAND=$(echo "$LAST_ENTRY" | jq -r '.command // ""')
          SIGNOFF_AUTHOR=$(echo "$LAST_ENTRY" | jq -r '.author // ""')

          echo "Last PRMerger command: $LAST_COMMAND (by: $SIGNOFF_AUTHOR)"

          if [ "$LAST_COMMAND" = "#sign-off" ]; then
            echo "is_signoff=true" >> "$GITHUB_OUTPUT"
            echo "author=$SIGNOFF_AUTHOR" >> "$GITHUB_OUTPUT"
          else
            echo "is_signoff=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Authorization checks ---

      - name: Create GitHub App token
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MSECD_APP_ID }}
          private-key: ${{ secrets.MSECD_APP_PK }}
          owner: ${{ github.repository_owner }}

      - name: Compute approvers cache key
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        id: cache-key
        run: |
          AUTH_FILE=""
          for path in "authorized-approvers.txt" ".github/authorized-approvers.txt" "docs/authorized-approvers.txt"; do
            if [ -f "$path" ]; then
              AUTH_FILE="$path"
              break
            fi
          done

          if [ -z "$AUTH_FILE" ]; then
            echo "::warning::No authorized-approvers.txt found."
            echo "hash=none" >> "$GITHUB_OUTPUT"
          else
            HASH=$(sha256sum "$AUTH_FILE" | cut -d' ' -f1 | head -c 12)
            echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%d-%H)" >> "$GITHUB_OUTPUT"

      - name: Restore approvers cache
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        id: approvers-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/resolved-approvers.txt
          key: approvers-${{ steps.cache-key.outputs.hash }}-${{ steps.cache-key.outputs.date }}

      - name: Resolve authorized approvers
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.approvers-cache.outputs.cache-hit != 'true'
        id: resolve-approvers
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Find authorized-approvers.txt
          AUTH_FILE=""
          for path in "authorized-approvers.txt" ".github/authorized-approvers.txt" "docs/authorized-approvers.txt"; do
            if [ -f "$path" ]; then
              AUTH_FILE="$path"
              break
            fi
          done

          : > /tmp/auth-teams.txt
          if [ -z "$AUTH_FILE" ]; then
            echo "::warning::No authorized-approvers.txt found."
            touch /tmp/resolved-approvers.txt
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found: $AUTH_FILE"

          RESOLVE_FAILED=false
          : > /tmp/resolve-failed.flag

          # Resolve team references with pagination and cache
          declare -A TEAM_CACHE
          resolve_team() {
            local org="$1" team="$2" key="$org/$team"
            if [[ -n "${TEAM_CACHE[$key]+x}" ]]; then
              echo "${TEAM_CACHE[$key]}"
              return
            fi
            local page=1 all_members=""
            while :; do
              local response http_code body page_members count
              response=$(curl -s -w "\n%{http_code}" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/orgs/${org}/teams/${team}/members?per_page=100&page=${page}")
              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')
              if [ "$http_code" != "200" ]; then
                echo "::error::Failed to resolve team $key (HTTP $http_code)" >&2
                # Subshell variable assignments don't propagate; use a sentinel file.
                echo "1" > /tmp/resolve-failed.flag
                break
              fi
              page_members=$(echo "$body" | jq -r '.[].login' 2>/dev/null || true)
              [ -z "$page_members" ] && break
              all_members="$all_members $page_members"
              count=$(echo "$body" | jq 'length')
              [ "$count" -lt 100 ] && break
              ((page++))
            done
            TEAM_CACHE["$key"]="$all_members"
            echo "$all_members"
          }

          # Parse rules and collect all authorized usernames
          ALL_USERS=""
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line// }" ]] && continue
            owners=$(echo "$line" | grep -oE '@[^ [:space:]]+' | sed 's/@//' || true)
            [ -z "$owners" ] && continue
            for entry in $owners; do
              entry="${entry%$'\r'}"
              if [[ "$entry" == *"/"* ]]; then
                org_name=$(echo "$entry" | cut -d'/' -f1)
                team_name=$(echo "$entry" | cut -d'/' -f2)
                # Record team for live-fallback membership checks later
                echo "${org_name}/${team_name}" >> /tmp/auth-teams.txt
                resolved=$(resolve_team "$org_name" "$team_name")
                ALL_USERS="$ALL_USERS $resolved"
              else
                ALL_USERS="$ALL_USERS $entry"
              fi
            done
          done < "$AUTH_FILE"

          # Deduplicate the recorded team list
          if [ -s /tmp/auth-teams.txt ]; then
            sort -u /tmp/auth-teams.txt -o /tmp/auth-teams.txt
          fi

          # Write deduplicated lowercase list
          echo "$ALL_USERS" | tr ' ' '\n' | grep -v '^$' | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/resolved-approvers.txt
          RESOLVED_COUNT=$(wc -l < /tmp/resolved-approvers.txt)
          echo "Resolved $RESOLVED_COUNT unique approvers."
          cat /tmp/resolved-approvers.txt

          if [ "$RESOLVE_FAILED" = "true" ] || [ -s /tmp/resolve-failed.flag ] || [ "$RESOLVED_COUNT" -eq 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Approvers resolution incomplete; cache will not be saved. Live membership fallback will be used."
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save approvers cache
        if: >-
          steps.resolve.outputs.skip != 'true'
          && steps.pr-state.outputs.skip != 'true'
          && steps.approvers-cache.outputs.cache-hit != 'true'
          && steps.resolve-approvers.outputs.failed != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/resolved-approvers.txt
          key: approvers-${{ steps.cache-key.outputs.hash }}-${{ steps.cache-key.outputs.date }}

      - name: Extract team references for live fallback
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        id: teams-list
        run: |
          # Build /tmp/auth-teams.txt from the local approvers file. Runs on
          # every execution so live fallback works even on cache-hit runs.
          AUTH_FILE=""
          for path in "authorized-approvers.txt" ".github/authorized-approvers.txt" "docs/authorized-approvers.txt"; do
            if [ -f "$path" ]; then
              AUTH_FILE="$path"
              break
            fi
          done

          : > /tmp/auth-teams.txt
          if [ -z "$AUTH_FILE" ]; then
            echo "No authorized-approvers.txt found; live fallback will be a no-op."
            exit 0
          fi

          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line// }" ]] && continue
            owners=$(echo "$line" | grep -oE '@[^ [:space:]]+' | sed 's/@//' || true)
            for entry in $owners; do
              entry="${entry%$'\r'}"
              if [[ "$entry" == *"/"* ]]; then
                echo "$entry" >> /tmp/auth-teams.txt
              fi
            done
          done < "$AUTH_FILE"

          if [ -s /tmp/auth-teams.txt ]; then
            sort -u /tmp/auth-teams.txt -o /tmp/auth-teams.txt
            echo "Team references for live fallback:"
            cat /tmp/auth-teams.txt
          fi

      - name: Check if sign-off author is authorized
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.signoff.outputs.is_signoff == 'true'
        id: signoff-auth
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          USER=$(echo "${{ env.TEST_USER || steps.signoff.outputs.author }}" | tr '[:upper:]' '[:lower:]')
          if grep -qx "$USER" /tmp/resolved-approvers.txt; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "Sign-off author '$USER' is authorized (cache hit)."
            exit 0
          fi
          # Live fallback: check team membership directly via API.
          if [ -s /tmp/auth-teams.txt ]; then
            while IFS= read -r team_ref || [ -n "$team_ref" ]; do
              org=$(echo "$team_ref" | cut -d'/' -f1)
              team=$(echo "$team_ref" | cut -d'/' -f2)
              http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/orgs/${org}/teams/${team}/memberships/${USER}")
              if [ "$http_code" = "200" ]; then
                echo "authorized=true" >> "$GITHUB_OUTPUT"
                echo "Sign-off author '$USER' is authorized (live fallback: ${team_ref})."
                exit 0
              fi
            done < /tmp/auth-teams.txt
          fi
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "Sign-off author '$USER' is NOT authorized."

      - name: Check if PR author is authorized
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.pr-state.outputs.has_qualifies == 'true' && steps.signoff.outputs.is_signoff != 'true'
        id: pr-author-auth
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          USER=$(echo "${{ env.TEST_USER || steps.pr-state.outputs.pr_author }}" | tr '[:upper:]' '[:lower:]')
          if grep -qx "$USER" /tmp/resolved-approvers.txt; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "PR author '$USER' is authorized (cache hit)."
            exit 0
          fi
          if [ -s /tmp/auth-teams.txt ]; then
            while IFS= read -r team_ref || [ -n "$team_ref" ]; do
              org=$(echo "$team_ref" | cut -d'/' -f1)
              team=$(echo "$team_ref" | cut -d'/' -f2)
              http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/orgs/${org}/teams/${team}/memberships/${USER}")
              if [ "$http_code" = "200" ]; then
                echo "authorized=true" >> "$GITHUB_OUTPUT"
                echo "PR author '$USER' is authorized (live fallback: ${team_ref})."
                exit 0
              fi
            done < /tmp/auth-teams.txt
          fi
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "PR author '$USER' is NOT authorized."

      - name: Check if reopener is authorized
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && github.event_name == 'pull_request_target' && github.event.action == 'reopened'
        id: reopener-auth
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          USER=$(echo "${{ env.TEST_USER || github.event.sender.login }}" | tr '[:upper:]' '[:lower:]')
          if grep -qx "$USER" /tmp/resolved-approvers.txt; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "Reopener '$USER' is authorized (cache hit)."
            exit 0
          fi
          if [ -s /tmp/auth-teams.txt ]; then
            while IFS= read -r team_ref || [ -n "$team_ref" ]; do
              org=$(echo "$team_ref" | cut -d'/' -f1)
              team=$(echo "$team_ref" | cut -d'/' -f2)
              http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/orgs/${org}/teams/${team}/memberships/${USER}")
              if [ "$http_code" = "200" ]; then
                echo "authorized=true" >> "$GITHUB_OUTPUT"
                echo "Reopener '$USER' is authorized (live fallback: ${team_ref})."
                exit 0
              fi
            done < /tmp/auth-teams.txt
          fi
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "Reopener '$USER' is NOT authorized."

      # --- Branch 1: Unauthorized sign-off → hold-off + block label ---

      - name: Hold off on unauthorized sign-off
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.signoff.outputs.is_signoff == 'true' && steps.signoff-auth.outputs.authorized == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGNOFF_AUTHOR: ${{ env.TEST_USER || steps.signoff.outputs.author }}
          PR_NUMBER: ${{ steps.pr-state.outputs.number }}
          REPO: ${{ github.repository }}
          HAS_QUALIFIES: ${{ steps.pr-state.outputs.has_qualifies }}
        run: |
          echo "Sign-off author '$SIGNOFF_AUTHOR' is not authorized. Adding hold-off comment..."

          COMMENT_BODY="#hold-off
          This PR requires a writer review before merging.
          The review process typically takes 2-3 business days. For urgent requests, please contact the page's author or assigned team."

          jq -n --arg body "$COMMENT_BODY" '{body: $body}' | \
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d @-

          echo "Hold-off comment added."

          if [ "$HAS_QUALIFIES" = "true" ]; then
            curl -s -X DELETE \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/qualifies-for-auto-merge"

            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" \
              -d '{"labels":["blocked-qualifies-for-auto-merge"]}'

            echo "Swapped 'qualifies-for-auto-merge' to 'blocked-qualifies-for-auto-merge'."
          fi

      # --- Branch 2: Authorized sign-off → restore label ---

      - name: Restore auto-merge label on authorized sign-off
        if: steps.resolve.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.signoff.outputs.is_signoff == 'true' && steps.signoff-auth.outputs.authorized == 'true' && steps.pr-state.outputs.has_blocked == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGNOFF_AUTHOR: ${{ env.TEST_USER || steps.signoff.outputs.author }}
          PR_NUMBER: ${{ steps.pr-state.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Author '$SIGNOFF_AUTHOR' is authorized. Restoring auto-merge label..."

          curl -s -X DELETE \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/blocked-qualifies-for-auto-merge"

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" \
            -d '{"labels":["qualifies-for-auto-merge"]}'

          echo "Restored 'qualifies-for-auto-merge' label."

      # --- Branch 3: Unauthorized PR owner with qualifies-for-auto-merge ---

      - name: Block auto-merge for unauthorized PR author
        if: >-
          steps.resolve.outputs.skip != 'true'
          && steps.pr-state.outputs.skip != 'true'
          && steps.pr-state.outputs.has_qualifies == 'true'
          && steps.pr-author-auth.outputs.authorized == 'false'
          && steps.signoff.outputs.is_signoff != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ steps.pr-state.outputs.pr_author }}
          PR_NUMBER: ${{ steps.pr-state.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "PR author '$PR_AUTHOR' is not authorized. Blocking auto-merge..."

          curl -s -X DELETE \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/qualifies-for-auto-merge"

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" \
            -d '{"labels":["blocked-qualifies-for-auto-merge"]}'

          echo "Swapped 'qualifies-for-auto-merge' to 'blocked-qualifies-for-auto-merge'."

          COMMENT_BODY="The 'qualifies-for-auto-merge' label was removed because the PR author is not an authorized approver.
          Only authorized approvers can have their PRs qualify for auto-merge.
          If you believe this PR qualifies for auto-merge, please contact an authorized reviewer."

          jq -n --arg body "$COMMENT_BODY" '{body: $body}' | \
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d @-

          echo "Explanation comment added."

      # --- Branch 4: Authorized reopen → restore label ---

      - name: Restore auto-merge label on authorized reopen
        if: >-
          steps.resolve.outputs.skip != 'true'
          && steps.pr-state.outputs.skip != 'true'
          && github.event_name == 'pull_request_target'
          && github.event.action == 'reopened'
          && steps.reopener-auth.outputs.authorized == 'true'
          && steps.pr-state.outputs.has_blocked == 'true'
          && steps.signoff.outputs.is_signoff != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REOPENER: ${{ env.TEST_USER || github.event.sender.login }}
          PR_NUMBER: ${{ steps.pr-state.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Reopener '$REOPENER' is authorized. Restoring auto-merge label..."

          curl -s -X DELETE \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/blocked-qualifies-for-auto-merge"

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" \
            -d '{"labels":["qualifies-for-auto-merge"]}'

          echo "Restored 'qualifies-for-auto-merge' label."

          COMMENT_BODY="Auto-merge restored on reopen by authorized approver @${REOPENER}."

          jq -n --arg body "$COMMENT_BODY" '{body: $body}' | \
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d @-

          echo "Confirmation comment added."
